<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lybris 学科资料站模板</title>
    <meta
      name="description"
      content="面向多学科资料整理、上传、索引与共享的静态站点模板。"
    />
    <link rel="stylesheet" href="vendor/viewerjs/viewer.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="decorativeChips" class="ambient-chips" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="hero-panel glass-panel">
        <div class="brand">
          <img id="siteAvatar" src="assets/avatar.png" alt="站点头像" class="avatar" />
          <div class="brand-copy">
            <p class="eyebrow">Vitemis Library Shelf</p>
            <h1 class="site-title">
              <span id="brandName" class="title-en">Lybris</span>
              <span id="subjectName" class="title-cn">学科资料库</span>
            </h1>
            <p id="siteSubtitle">课本知识上传与共享计划</p>
          </div>
        </div>

        <aside class="source-card">
          <div>
            <p class="source-label">资料源</p>
            <strong id="sourceName">Lybris 资料索引</strong>
            <span id="sourceUpdated">待配置资料源</span>
          </div>
          <a
            id="openAllBtn"
            class="btn secondary"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            资料源待配置
          </a>
        </aside>
      </header>

      <section class="search-panel glass-panel" aria-label="资料搜索与分类">
        <div class="search-head">
          <label class="search-label" for="searchInput">搜索资料库</label>
          <button id="backBtn" class="btn ghost" type="button">返回上一级</button>
        </div>
        <input id="searchInput" type="search" placeholder="搜索资料、课程、文件名..." aria-label="搜索" />
        <nav id="categoryPills" class="category-pills" aria-label="资源分类"></nav>
      </section>

      <section class="overview-grid" aria-label="学科资料概览">
        <article class="metric-card glass-panel">
          <span class="metric-label">资料集</span>
          <strong id="folderCount">0</strong>
          <small>Collection</small>
        </article>
        <article class="metric-card glass-panel">
          <span class="metric-label">资料</span>
          <strong id="fileCount">0</strong>
          <small>Resource</small>
        </article>
        <article class="metric-card glass-panel">
          <span class="metric-label">最近同步</span>
          <strong id="latestUpdate">-</strong>
          <small>Static index</small>
        </article>
        <article class="source-overview glass-panel">
          <span class="type-badge source">SOURCE</span>
          <div>
            <strong id="sourceSummaryTitle">学科资料库</strong>
            <p id="sourceSummaryText">用于组织课程讲义、学习笔记、习题与真题、参考资料和拓展阅读。</p>
          </div>
        </article>
      </section>

      <main class="library-layout">
        <aside class="sidebar glass-panel">
          <div class="panel-head">
            <p class="eyebrow">Collections</p>
            <h2 id="sidebarTitle">资料导航</h2>
          </div>
          <nav id="folderTree" class="folder-tree" aria-label="完整文件夹树"></nav>
        </aside>

        <section class="library-main glass-panel">
          <div class="view-head">
            <div>
              <p class="eyebrow">Current Shelf</p>
              <h2 id="viewTitle">全部资料</h2>
            </div>
            <span id="resultCount" class="count-pill"></span>
          </div>
          <nav id="breadcrumb" class="breadcrumb" aria-label="当前路径"></nav>
          <div id="contentList" class="content-grid"></div>
        </section>
      </main>
    </div>

    <div id="previewModal" class="preview-modal" aria-hidden="true" hidden>
      <div class="preview-backdrop" data-preview-close></div>
      <section class="preview-dialog glass-panel" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview-header">
          <div class="preview-heading">
            <span id="previewBadge" class="type-badge file">PREVIEW</span>
            <h2 id="previewTitle">资料预览</h2>
          </div>
          <div class="preview-controls">
            <a
              id="previewOpenOriginal"
              class="btn secondary"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              打开原文件
            </a>
            <button id="previewCloseBtn" class="preview-close-btn" type="button" aria-label="关闭预览">
              关闭
            </button>
          </div>
        </header>
        <div id="previewContent" class="preview-content"></div>
      </section>
    </div>

    <script src="vendor/markdown-it/markdown-it.js"></script>
    <script src="vendor/dompurify/purify.min.js"></script>
    <script src="vendor/viewerjs/viewer.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
